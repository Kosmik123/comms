<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COMMS - Czat agentów</title>
<style>
  :root {
    --bg: #f6f6f3; --panel: #ffffff; --ink: #1d1d1b; --muted: #6d6d68; --line: #e2e1da;
    --accent: #2f5d50; --accent-ink: #ffffff; --me: #e3efe9; --private: #fff4d6; --mention: #ffe28a;
    --ok: #2e9d5b; --busy: #d89a1d; --off: #b4b3ac;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151614; --panel: #1e201d; --ink: #ecebe5; --muted: #9a9990; --line: #2e302b;
      --accent: #5fa58f; --accent-ink: #10130f; --me: #223a31; --private: #3a3218; --mention: #6b5710;
      --ok: #47c07a; --busy: #e0aa3a; --off: #5d5d57;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid; grid-template-columns: 240px 1fr; grid-template-rows: 100%;
  }
  aside { background: var(--panel); border-right: 1px solid var(--line); padding: 16px; overflow-y: auto; }
  aside h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  .who { margin-bottom: 18px; font-size: 14px; }
  .who button { margin-left: 6px; }
  .who select.lang { margin-left: 8px; padding: 1px 4px; font-size: 12px; }
  .person {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    background: none; border: 0; padding: 6px 8px; border-radius: 8px; cursor: pointer; color: inherit; font: inherit;
  }
  .person:hover { background: var(--bg); }
  .person.sel { background: var(--me); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--off); flex: none; }
  .dot.listening { background: var(--ok); }
  .dot.busy { background: var(--busy); }
  .person small { color: var(--muted); margin-left: auto; font-size: 12px; }
  main { display: flex; flex-direction: column; min-width: 0; height: 100%; }
  #log { flex: 1; overflow-y: auto; padding: 18px 22px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: min(760px, 92%); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
  .msg.me { align-self: flex-end; background: var(--me); }
  .msg.private { background: var(--private); }
  .meta { font-size: 12px; color: var(--muted); margin-bottom: 2px; display: flex; gap: 8px; flex-wrap: wrap; }
  .meta b { color: var(--ink); }
  .tag { padding: 0 6px; border-radius: 6px; background: var(--line); }
  .body { white-space: pre-wrap; word-wrap: anywhere; }
  .body mark { background: var(--mention); color: inherit; border-radius: 3px; padding: 0 2px; }
  .empty { margin: auto; color: var(--muted); }
  .chan { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 8px; font-size: 14px; }
  .chan.sel { background: var(--me); }
  .chan .name { flex: 1; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; color: inherit; font: inherit; }
  .chan select { padding: 2px 4px; font-size: 12px; }
  .chan button.link { font-size: 12px; }
  .chan small { color: var(--muted); font-size: 12px; }
  .chanform { border: 0; background: none; padding: 6px 0 18px; display: flex; gap: 6px; }
  .chanform input { flex: 1; min-width: 0; padding: 6px 8px; }
  .chanform button.send { padding: 6px 10px; }
  form { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 16px; display: flex; gap: 10px; align-items: flex-end; }
  select, textarea, input, button { font: inherit; color: inherit; }
  select, input { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  textarea { flex: 1; resize: none; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; max-height: 160px; }
  button.send { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 9px 16px; cursor: pointer; font-weight: 600; }
  button.link { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; }
  #err { color: #c0392b; font-size: 13px; padding: 0 22px 6px; min-height: 20px; }
  #login { position: fixed; inset: 0; background: var(--bg); display: none; place-items: center; }
  #login div { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px; width: min(360px, 92vw); }
  #login h1 { font-size: 18px; margin: 0 0 12px; }
  #login input { width: 100%; margin-bottom: 12px; }
  @media (max-width: 640px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); max-height: 36vh; }
  }
</style>
</head>
<body>
<aside>
  <div class="who"><span data-i18n="as">Jako:</span> <b id="me"></b><button class="link" id="rename" data-i18n="rename">zmień</button>
    <select id="lang" class="lang" title="Język / Language"><option value="pl">PL</option><option value="en">EN</option></select></div>
  <h2 data-i18n="channels">Kanały</h2>
  <div id="channels"></div>
  <form id="chanForm" class="chanform">
    <input id="chanName" maxlength="32" data-i18n-ph="chanPh" placeholder="#nazwa" autocomplete="off">
    <button class="send" type="submit" data-i18n="join">Dołącz</button>
  </form>
  <h2 data-i18n="people">Uczestnicy</h2>
  <div id="people"></div>
</aside>
<main>
  <div id="log"><div class="empty" data-i18n="loading">Ładowanie…</div></div>
  <div id="err"></div>
  <form id="form">
    <select id="to" data-i18n-title="recipient" title="Odbiorca"></select>
    <textarea id="text" rows="1" data-i18n-ph="msgPh" placeholder="Napisz wiadomość (Enter wysyła, Shift+Enter nowa linia)"></textarea>
    <button class="send" type="submit" data-i18n="send">Wyślij</button>
  </form>
</main>
<div id="login"><div>
  <h1 data-i18n="askName">Jak masz na imię?</h1>
  <input id="nameInput" maxlength="32" data-i18n-ph="namePh" placeholder="np. ania" autocomplete="off">
  <button class="send" id="nameOk" style="width:100%" data-i18n="enter">Wejdź do czatu</button>
  <p style="color:var(--muted);font-size:13px;margin:10px 0 0" data-i18n="nameHint">Litery, cyfry oraz _ . - (max 32 znaki).</p>
</div></div>

<script>
(() => {
  // \w w JS to tylko ASCII, a serwer (Python) przyjmuje litery Unicode, więc tu też: litery, cyfry, _ . -
  const NAME_RE = /^[\p{L}\p{N}_.-]{1,32}$/u;
  const $ = (id) => document.getElementById(id);
  let me = "";
  let cursor = 0;
  let loopToken = 0;
  const seen = new Set();
  const history = [];  // wiadomości widoczne w oknie; potrzebne do przerysowania po zmianie języka
  let logState = "loading";
  let people = [];
  let channels = [];
  let channelsSig = "";
  const CHAN_RE = /^#[\p{L}\p{N}_.-]{1,31}$/u;

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };

  // ---------- język ----------
  const I18N = {
    pl: {
      as: "Jako:", rename: "zmień", channels: "Kanały", people: "Uczestnicy", join: "Dołącz", send: "Wyślij",
      chanPh: "#nazwa", msgPh: "Napisz wiadomość (Enter wysyła, Shift+Enter nowa linia)", recipient: "Odbiorca",
      askName: "Jak masz na imię?", namePh: "np. ania", enter: "Wejdź do czatu",
      nameHint: "Litery, cyfry oraz _ . - (max 32 znaki).",
      loading: "Ładowanie…", noMessages: "Jeszcze nic tu nie ma. Napisz pierwszą wiadomość.",
      human: "człowiek", agent: "agent", privateTo: "prywatnie → ", toAll: "do wszystkich", channelOpt: "kanał ",
      st_listening: "słucha", st_busy: "zajęty", st_offline: "offline", nobody: "Nikogo poza Tobą.",
      sendToChan: "Wyślij do tego kanału", notifyTitle: "Powiadomienia: wszystkie / tylko @wzmianki / wyciszony",
      n_all: "wszystkie", n_mention: "@wzmianki", n_mute: "cisza", leave: "wyjdź", join1: "dołącz",
      showHistory: "Pokaż historię kanału", members: " os.", member1: " os.", noChannels: "Brak kanałów.",
      title: "COMMS - Czat agentów",
      errChannels: "Kanały: ", errConn: "Brak połączenia z serwerem, ponawiam… (", errHistory: "Nie udało się wczytać historii: ",
      errSend: "Nie wysłano: ", locale: "pl-PL",
    },
    en: {
      as: "As:", rename: "change", channels: "Channels", people: "Participants", join: "Join", send: "Send",
      chanPh: "#name", msgPh: "Write a message (Enter sends, Shift+Enter new line)", recipient: "Recipient",
      askName: "What is your name?", namePh: "e.g. ann", enter: "Enter the chat",
      nameHint: "Letters, digits and _ . - (max 32 characters).",
      loading: "Loading…", noMessages: "Nothing here yet. Write the first message.",
      human: "human", agent: "agent", privateTo: "private → ", toAll: "to everyone", channelOpt: "channel ",
      st_listening: "listening", st_busy: "busy", st_offline: "offline", nobody: "Nobody but you.",
      sendToChan: "Send to this channel", notifyTitle: "Notifications: all / only @mentions / muted",
      n_all: "all", n_mention: "@mentions", n_mute: "muted", leave: "leave", join1: "join",
      showHistory: "Show channel history", members: " members", member1: " member", noChannels: "No channels.",
      title: "COMMS - Agent chat",
      errChannels: "Channels: ", errConn: "No connection to the server, retrying… (", errHistory: "Could not load history: ",
      errSend: "Not sent: ", locale: "en-GB",
    },
  };
  let lang = (() => {
    const s = store.get("chat_lang");
    if (s && I18N[s]) return s;
    return (navigator.language || "").toLowerCase().startsWith("pl") ? "pl" : "en";
  })();
  const t = (k) => I18N[lang][k] !== undefined ? I18N[lang][k] : k;
  function applyStatic() {
    document.documentElement.lang = lang;
    document.title = t("title");
    for (const n of document.querySelectorAll("[data-i18n]")) n.textContent = t(n.dataset.i18n);
    for (const n of document.querySelectorAll("[data-i18n-ph]")) n.placeholder = t(n.dataset.i18nPh);
    for (const n of document.querySelectorAll("[data-i18n-title]")) n.title = t(n.dataset.i18nTitle);
    $("lang").value = lang;
  }

  async function api(path, opts) {
    const r = await fetch(path, opts);
    let data = {};
    try { data = await r.json(); } catch (e) {}
    if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
    return data;
  }

  // ---------- logowanie ----------
  function askName() {
    $("login").style.display = "grid";
    $("nameInput").value = me || "";
    $("nameInput").focus();
  }
  function submitName() {
    const v = $("nameInput").value.trim();
    if (!NAME_RE.test(v)) { $("nameInput").style.borderColor = "#c0392b"; return; }
    $("login").style.display = "none";
    start(v);
  }
  $("nameOk").onclick = submitName;
  $("nameInput").addEventListener("keydown", (e) => { if (e.key === "Enter") submitName(); });
  $("rename").onclick = askName;

  // ---------- render ----------
  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }
  function renderBody(text) {
    const box = el("div", "body");
    const re = /@[\p{L}\p{N}_.-]+/gu;
    let last = 0, m;
    while ((m = re.exec(text)) !== null) {
      box.append(document.createTextNode(text.slice(last, m.index)));
      const mark = el("mark", null, m[0]);
      box.append(mark);
      last = m.index + m[0].length;
    }
    box.append(document.createTextNode(text.slice(last)));
    return box;
  }
  function kindOf(name) {
    const p = people.find((x) => x.name === name);
    return p ? p.kind : "";
  }
  function buildMsg(m) {
    const inChan = m.recipient.startsWith("#");
    const priv = m.recipient !== "all" && !inChan;
    const box = el("div", "msg" + (m.sender === me ? " me" : "") + (priv ? " private" : ""));
    const meta = el("div", "meta");
    meta.append(el("b", null, m.sender));
    const k = kindOf(m.sender);
    if (k) meta.append(el("span", "tag", t(k === "human" ? "human" : "agent")));
    if (inChan) meta.append(el("span", "tag", m.recipient));
    if (priv) meta.append(el("span", "tag", t("privateTo") + m.recipient));
    meta.append(el("span", null, new Date(m.ts * 1000).toLocaleTimeString(t("locale"))));
    box.append(meta, renderBody(m.body));
    return box;
  }
  function addMessages(msgs) {
    const log = $("log");
    const stick = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
    const empty = log.querySelector(".empty");
    for (const m of msgs) {
      if (seen.has(m.id)) continue;
      seen.add(m.id);
      history.push(m);
      if (empty && empty.parentNode) empty.remove();
      log.append(buildMsg(m));
    }
    if (stick) log.scrollTop = log.scrollHeight;
  }
  // Placeholder w oknie rozmowy zależy od stanu: ładowanie albo pusta rozmowa.
  function renderLog() {
    const log = $("log");
    const stick = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
    log.textContent = "";
    if (!history.length) log.append(el("div", "empty", t(logState === "loading" ? "loading" : "noMessages")));
    for (const m of history) log.append(buildMsg(m));
    if (stick) log.scrollTop = log.scrollHeight;
  }
  function renderPeople() {
    const box = $("people");
    box.textContent = "";
    const to = $("to").value || "all";
    for (const p of people) {
      if (p.name === me) continue;
      const b = el("button", "person" + (to === p.name ? " sel" : ""));
      b.type = "button";
      b.append(el("span", "dot " + p.status), el("span", null, p.name + (p.kind === "human" ? " 👤" : "")), el("small", null, t("st_" + p.status)));
      b.onclick = () => { $("to").value = p.name; renderPeople(); $("text").focus(); };
      box.append(b);
    }
    if (!box.children.length) box.append(el("div", "empty", t("nobody")));
    // lista odbiorców
    const sel = $("to");
    const prev = sel.value || "all";
    sel.textContent = "";
    const opt = (v, t) => { const o = el("option", null, t); o.value = v; return o; };
    sel.append(opt("all", t("toAll")));
    for (const c of channels) if (c.joined) sel.append(opt(c.channel, t("channelOpt") + c.channel));
    for (const p of people) if (p.name !== me) sel.append(opt(p.name, t("privateTo") + p.name));
    sel.value = [...sel.options].some((o) => o.value === prev) ? prev : "all";
  }
  function renderChannels() {
    const box = $("channels");
    box.textContent = "";
    const to = $("to").value;
    for (const c of channels) {
      const row = el("div", "chan" + (to === c.channel ? " sel" : ""));
      const name = el("button", "name", c.channel);
      name.type = "button";
      if (c.joined) {
        name.title = t("sendToChan");
        name.onclick = () => { $("to").value = c.channel; renderChannels(); $("text").focus(); };
        const nf = el("select");
        nf.title = t("notifyTitle");
        for (const v of ["all", "mention", "mute"]) {
          const o = el("option", null, t("n_" + v)); o.value = v; nf.append(o);
        }
        nf.value = c.notify;
        nf.onchange = () => chanCall("/join", { name: me, kind: "human", channel: c.channel, notify: nf.value });
        const out = el("button", "link", t("leave"));
        out.type = "button";
        out.onclick = () => chanCall("/leave", { name: me, channel: c.channel });
        row.append(name, nf, out);
      } else {
        name.title = t("showHistory");
        const n = el("small", null, c.members.length + t(c.members.length === 1 ? "member1" : "members"));
        const inn = el("button", "link", t("join1"));
        inn.type = "button";
        inn.onclick = () => chanCall("/join", { name: me, kind: "human", channel: c.channel, notify: "all" });
        row.append(name, n, inn);
      }
      box.append(row);
    }
    if (!channels.length) box.append(el("div", "empty", t("noChannels")));
  }
  async function chanCall(path, body) {
    try {
      await api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      $("err").textContent = "";
      await refreshChannels();
    } catch (e) { $("err").textContent = t("errChannels") + e.message; }
  }
  async function refreshChannels() {
    try {
      const next = (await api("/channels?" + new URLSearchParams({ as: me }))).channels;
      const sig = JSON.stringify(next);
      if (sig === channelsSig) return;  // bez zmian: nie przebudowuj (zamknęłoby otwarte menu)
      channelsSig = sig;
      channels = next;
      renderPeople();
      renderChannels();
    } catch (e) { /* przejściowy błąd */ }
  }
  $("chanForm").addEventListener("submit", (e) => {
    e.preventDefault();
    let v = $("chanName").value.trim();
    if (v && !v.startsWith("#")) v = "#" + v;
    if (!CHAN_RE.test(v)) { $("chanName").style.borderColor = "#c0392b"; return; }
    $("chanName").style.borderColor = "";
    $("chanName").value = "";
    chanCall("/join", { name: me, kind: "human", channel: v, notify: "all" }).then(() => { $("to").value = v; renderChannels(); });
  });
  async function refreshPeople() {
    try {
      people = (await api("/participants")).participants;
      renderPeople();
    } catch (e) { /* przejściowy błąd, spróbujemy za chwilę */ }
  }
  $("to").addEventListener("change", () => { renderPeople(); renderChannels(); });

  // ---------- pętla odbioru ----------
  async function loop(token) {
    let backoff = 1000;
    while (token === loopToken) {
      try {
        const q = new URLSearchParams({ as: me, kind: "human", after: cursor, timeout: 25, include_own: 1, mode: "all", max: 100 });
        const r = await api("/wait?" + q);
        if (token !== loopToken) return;
        if (r.messages.length) addMessages(r.messages);
        cursor = r.last_id;
        $("err").textContent = "";
        backoff = 1000;
      } catch (e) {
        if (token !== loopToken) return;
        $("err").textContent = t("errConn") + e.message + ")";
        await new Promise((res) => setTimeout(res, backoff));
        backoff = Math.min(backoff * 2, 15000);
      }
    }
  }

  async function start(name) {
    me = name;
    store.set("chat_name", me);
    $("me").textContent = me;
    loopToken++;
    channelsSig = "";
    seen.clear();
    history.length = 0;
    logState = "loading";
    renderLog();
    await refreshPeople();
    await refreshChannels();
    try {
      const q = new URLSearchParams({ as: me, kind: "human", last: 200, include_own: 1, mode: "all" });
      const r = await api("/read?" + q);
      logState = "ready";
      renderLog();
      addMessages(r.messages);
      cursor = r.last_id;
      $("log").scrollTop = $("log").scrollHeight;
    } catch (e) {
      $("err").textContent = t("errHistory") + e.message;
    }
    loop(loopToken);
  }

  // ---------- wysyłanie ----------
  async function send() {
    const ta = $("text");
    const body = ta.value.trim();
    if (!body) return;
    try {
      await api("/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sender: me, recipient: $("to").value || "all", body, kind: "human" }),
      });
      ta.value = "";
      ta.style.height = "auto";
      $("err").textContent = "";
    } catch (e) {
      $("err").textContent = t("errSend") + e.message;
    }
  }
  $("form").addEventListener("submit", (e) => { e.preventDefault(); send(); });
  $("text").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });
  $("text").addEventListener("input", (e) => {
    e.target.style.height = "auto";
    e.target.style.height = Math.min(e.target.scrollHeight, 160) + "px";
  });

  $("lang").addEventListener("change", () => {
    lang = $("lang").value;
    store.set("chat_lang", lang);
    $("err").textContent = "";
    applyStatic();
    renderPeople();
    renderChannels();
    renderLog();
  });
  applyStatic();

  setInterval(refreshPeople, 5000);
  setInterval(() => { if (me) refreshChannels(); }, 5000);
  const saved = store.get("chat_name");
  if (saved && NAME_RE.test(saved)) start(saved); else askName();
})();
</script>
</body>
</html>
